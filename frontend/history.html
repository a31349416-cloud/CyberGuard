<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Історія — CyberGuard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">🛡️ Cyber<span>Guard</span></div>
  <div class="nav-links">
    <a href="index.html">Сканування</a>
    <a href="history.html" class="active">Історія</a>
    <a href="#" onclick="toggleTheme();return false;">🌓</a>
  </div>
</nav>
<div class="dashboard">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
    <h2 style="font-size:1.35rem;">📜 Історія сканувань</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input id="qInput" placeholder="Пошук по URL..." style="padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);">
      <select id="levelFilter" style="padding:7px 10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);">
        <option value="">Всі рівні</option>
        <option value="HIGH">HIGH</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="LOW">LOW</option>
      </select>
      <button class="btn-secondary" onclick="loadHistory()">🔄 Оновити</button>
      <button class="btn-secondary" onclick="compareSelected()">🆚 Порівняти (2)</button>
    </div>
  </div>
  <div class="card" style="padding:0; overflow:hidden;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll" onclick="toggleAll(this)"></th>
            <th>Дата</th><th>URL</th><th>Бал</th><th>Рівень</th><th>Знайдено</th><th>Статус</th><th>Дії</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="8" style="text-align:center; padding:30px; color:var(--muted);"><span class="spinner"></span> Завантаження...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div id="emptyBox" style="display:none; text-align:center; padding:30px; color:var(--muted);">Поки немає сканувань. <a href="index.html">Запусти перше!</a></div>
  <div id="compareBox" class="card" style="display:none; margin-top:18px;"></div>
</div>
<footer class="footer">CyberGuard v2 • 10 сканерів • <a href="index.html">Нове сканування</a></footer>
<script>
const API = location.origin.includes('localhost') ? 'http://localhost:8000' : '';
async function loadHistory(){
  const q=document.getElementById('qInput').value.trim();
  const lvl=document.getElementById('levelFilter').value;
  const tbody=document.getElementById('historyBody');
  tbody.innerHTML=`<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--muted);"><span class="spinner"></span> Завантаження...</td></tr>`;
  try{
    const params=new URLSearchParams({limit:50});
    if(q) params.set('q',q);
    if(lvl) params.set('level',lvl);
    const r=await fetch(`${API}/api/history?${params}`);
    const data=await r.json();
    const items=data.history||[];
    if(items.length===0){ tbody.innerHTML=''; document.getElementById('emptyBox').style.display='block'; return; }
    document.getElementById('emptyBox').style.display='none';
    tbody.innerHTML=items.map(it=>{
      const level=it.level||'LOW'; const color=level==='HIGH'?'HIGH':level==='MEDIUM'?'MEDIUM':'LOW';
      const scoreColor=level==='HIGH'?'#ef4444':level==='MEDIUM'?'#eab308':'#22c55e';
      const date=(it.created_at||'').slice(0,19).replace('T',' ');
      return `<tr>
        <td><input type="checkbox" class="rowCheck" value="${it.scan_id}"></td>
        <td style="font-size:0.82rem; color:var(--muted); white-space:nowrap;">${date}</td>
        <td style="max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><a href="#" onclick="goResult('${it.scan_id}');return false;">${escapeHtml(it.url)}</a></td>
        <td><b style="color:${scoreColor}">${it.risk_score}</b><span style="color:var(--muted)">/100</span></td>
        <td><span class="level-dot ${color}"></span>${level}</td>
        <td>${it.findings_count}</td>
        <td><span style="font-size:0.78rem; padding:3px 8px; border-radius:999px; background:rgba(56,189,248,0.1); border:1px solid rgba(56,189,248,0.2);">${it.status}</span></td>
        <td style="white-space:nowrap;"><a href="#" onclick="goResult('${it.scan_id}');return false;" style="font-size:0.82rem;">Відкрити</a> | <a href="#" onclick="delScan('${it.scan_id}');return false;" style="font-size:0.82rem; color:var(--red);">Видалити</a> | <a href="${API}/api/export/${it.scan_id}" style="font-size:0.82rem;">CSV</a></td>
      </tr>`;
    }).join('');
  }catch(e){ tbody.innerHTML=`<tr><td colspan="8" style="text-align:center; padding:20px; color:#fca5a5;">Помилка: ${escapeHtml(e.message)}</td></tr>`; }
}
function goResult(id){ location.href=`dashboard.html?id=${id}`; }
async function delScan(id){ if(!confirm('Видалити '+id+'?')) return; await fetch(`${API}/api/history/${id}`,{method:'DELETE'}); loadHistory(); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toggleAll(el){ document.querySelectorAll('.rowCheck').forEach(c=>c.checked=el.checked); }
async function compareSelected(){
  const ids=[...document.querySelectorAll('.rowCheck:checked')].map(c=>c.value);
  if(ids.length!==2) return alert('Обери рівно 2 сканування для порівняння');
  const r=await fetch(`${API}/api/compare?ids=${ids.join(',')}`);
  const data=await r.json();
  const box=document.getElementById('compareBox');
  box.style.display='block';
  box.innerHTML=`<h3>🆚 Порівняння ${ids[0]} vs ${ids[1]}</h3><p>Score delta: <b>${data.diff.score_delta>0?'+':''}${data.diff.score_delta}</b></p><p><b>Тільки в першому:</b> ${data.diff.only_in_first.join(', ')||'—'}</p><p><b>Тільки в другому:</b> ${data.diff.only_in_second.join(', ')||'—'}</p><p><b>Спільні:</b> ${data.diff.common.join(', ')||'—'}</p><div style="margin-top:10px; display:flex; gap:10px;"><a href="dashboard.html?id=${ids[0]}" class="btn-secondary">Відкрити 1</a><a href="dashboard.html?id=${ids[1]}" class="btn-secondary">Відкрити 2</a></div>`;
  box.scrollIntoView({behavior:'smooth'});
}
document.getElementById('qInput').addEventListener('keydown', e=>{ if(e.key==='Enter') loadHistory(); });
document.getElementById('levelFilter').addEventListener('change', loadHistory);
(function(){ const k='cg-theme'; if(localStorage.getItem(k)==='light') document.documentElement.setAttribute('data-theme','light'); window.toggleTheme=()=>{ const cur=document.documentElement.getAttribute('data-theme'); const n=cur==='light'?'dark':'light'; if(n==='light') document.documentElement.setAttribute('data-theme','light'); else document.documentElement.removeAttribute('data-theme'); localStorage.setItem(k,n); }; })();
loadHistory();
</script>
</body>
</html>
